
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="欢迎来到我们的教会">
  <title>教会官方网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #263746;
      background: #f7f6f2;
      line-height: 1.8;
    }
    header {
      background: #18354a;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 28px; }
    nav {
      padding: 14px;
      text-align: center;
      background: #ffffff;
    }
    nav a {
      margin: 0 10px;
      color: #18354a;
      text-decoration: none;
    }
    .hero {
      text-align: center;
      padding: 75px 20px;
      background: #e7ece8;
    }
    .hero h2 { font-size: 32px; }
    .content {
      max-width: 850px;
      margin: auto;
      padding: 25px 20px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 18px 0;
      border-radius: 12px;
    }
    footer {
      background: #18354a;
      color: white;
      text-align: center;
      padding: 22px;
    }
  </style>
</head>
<body>
  <header>
    <h1>思恩堂</h1>
    <p>认识神 · 经历爱 · 活出信仰</p>
  </header>

  <nav>
    <a href="#about">认识我们</a>
    <a href="#service">聚会时间</a>
    <a href="#ministry">团契事工</a>
    <a href="#contact">联系我们</a>
  </nav>

  <section class="hero">
    <h2>欢迎来到思恩堂</h2>
    <p>欢迎每一位朋友，一同认识神的爱。</p>
  </section>

  <main class="content">
    <section class="card" id="about">
      <h2>认识我们</h2>
      <p>在这里介绍教会的异象、使命与信仰。</p>
    </section>

    <section class="card" id="service">
      <h2>聚会时间</h2>
      <p>主日崇拜：请填写实际时间</p>
      <p>聚会地点：请填写教会地址</p>
    </section>

    <section class="card" id="ministry">
      <h2>团契与事工</h2>
      <p>成年团契 · 青年团契 · 少年团契</p>
      <p>欢迎加入我们的团契生活与服事。</p>
    </section>

    <section class="card" id="contact">
      <h2>联系我们</h2>
      <p>地址：请填写教会地址</p>
      <p>电邮：请填写教会公开联络电邮</p>
    </section>
  </main>

  <footer>
    <p>© 思恩堂 · 教会官方网站</p>
  </footer>
</body>
</html>
